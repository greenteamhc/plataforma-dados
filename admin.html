<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo | Plataforma de Estudos</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #F5F8FC;
            color: #07111F;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            min-height: 64px;
            background: #07111F;
            border-bottom: 1px solid #15263A;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #FFFFFF;
        }

        .navbar a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #00A86B;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #07111F;
        }

        .page-header p {
            margin: 0;
            color: #64748B;
        }

        /* =========================
           CARDS DE MÉTRICAS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: #FFFFFF;
            border: 1px solid #DCE4EE;
            border-radius: 14px;
            padding: 25px;

            box-shadow: 0 4px 15px rgba(7, 17, 31, 0.06);

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(7, 17, 31, 0.09);
        }

        .stat-title {
            color: #64748B;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #007BFF;
        }

        /* =========================
           SEÇÃO DE USUÁRIOS
        ========================= */

        .section {
            background: #FFFFFF;
            border: 1px solid #DCE4EE;
            border-radius: 14px;
            padding: 25px;

            box-shadow: 0 4px 15px rgba(7, 17, 31, 0.06);
        }

        .section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #07111F;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 10px;
            text-align: left;
            border-bottom: 1px solid #E5EAF0;
        }

        th {
            font-size: 13px;
            color: #64748B;
            background: #F8FAFC;
        }

        td {
            font-size: 14px;
            color: #334155;
        }

        tbody tr:hover {
            background: #F8FAFC;
        }

        /* =========================
           BADGES
        ========================= */

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #E2E8F0;
            color: #475569;
        }

        .badge-admin {
            background: #007BFF;
            color: #FFFFFF;
        }

        /* =========================
           MENSAGENS
        ========================= */

        .message {
            padding: 20px;
            text-align: center;
            color: #64748B;
        }

        .error {
            color: #B00020;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                padding: 15px 5%;
                gap: 15px;
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                padding: 30px 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .section {
                padding: 18px;
            }

            table {
                min-width: 800px;
            }

        }

    </style>

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">
            Plataforma de Estudos
        </div>

        <a href="index.html">
            Voltar para a plataforma
        </a>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================= -->

    <main class="container">

        <div class="page-header">

            <h1>
                Painel Administrativo
            </h1>

            <p>
                Acompanhe os usuários da plataforma.
            </p>

        </div>


        <!-- =========================
             MÉTRICAS
        ========================= -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    Total de usuários
                </div>

                <div
                    class="stat-number"
                    id="total-usuarios"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Alunos
                </div>

                <div
                    class="stat-number"
                    id="total-alunos"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Administradores
                </div>

                <div
                    class="stat-number"
                    id="total-admins"
                >
                    -
                </div>

            </div>

        </section>


        <!-- =========================
             LISTA DE USUÁRIOS
        ========================= -->

        <section class="section">

            <h2>
                Usuários cadastrados
            </h2>

            <div
                id="mensagem"
                class="message"
            >
                Carregando usuários...
            </div>


            <div class="table-container">

                <table id="tabela-usuarios">

                    <thead>

                        <tr>

                            <th>
                                Nome
                            </th>

                            <th>
                                E-mail
                            </th>

                            <th>
                                WhatsApp
                            </th>

                            <th>
                                Tipo
                            </th>

                            <th>
                                Cadastro
                            </th>

                            <th>
                                Último acesso
                            </th>

                            <th>
                                Progresso
                            </th>

                        </tr>

                    </thead>

                    <tbody id="usuarios-body"></tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        async function carregarPainel() {

            const mensagem =
                document.getElementById("mensagem");

            try {

                // ---------------------------------------------
                // VERIFICAR SESSÃO
                // ---------------------------------------------

                const {
                    data: {
                        session
                    }
                } = await supabaseClient.auth.getSession();


                if (!session) {

                    mensagem.textContent =
                        "Você precisa estar logado para acessar o painel.";

                    return;
                }


                // ---------------------------------------------
                // VERIFICAR ADMINISTRADOR
                // ---------------------------------------------

                const {
                    data: perfilAtual,
                    error: perfilError
                } = await supabaseClient
                    .from("profiles")
                    .select("tipo_conta")
                    .eq("id", session.user.id)
                    .single();


                if (perfilError || !perfilAtual) {

                    mensagem.textContent =
                        "Não foi possível verificar seu acesso.";

                    return;
                }


                if (
                    perfilAtual.tipo_conta !== "admin" &&
                    perfilAtual.tipo_conta !== "admin_principal"
                ) {

                    mensagem.textContent =
                        "Acesso restrito a administradores.";

                    return;
                }


                // ---------------------------------------------
                // BUSCAR PERFIS
                // ---------------------------------------------

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("profiles")
                    .select("*")
                    .order("data_cadastro", {
                        ascending: false
                    });


                if (error) {

                    console.error(error);

                    mensagem.innerHTML =
                        `<span class="error">
                            Erro ao carregar usuários:
                            ${error.message}
                        </span>`;

                    return;
                }


                // ---------------------------------------------
                // BUSCAR PROGRESSO
                // ---------------------------------------------

                const {
                    data: progresso,
                    error: progressoError
                } = await supabaseClient
                    .from("progress")
                    .select(
                        "user_id, lesson_id, completed"
                    )
                    .eq("completed", true);


                if (progressoError) {

                    console.error(
                        "Erro ao carregar progresso:",
                        progressoError
                    );

                }


                // ---------------------------------------------
                // MÉTRICAS
                // ---------------------------------------------

                const totalUsuarios =
                    data.length;


                const totalAlunos =
                    data.filter(
                        usuario =>
                            usuario.tipo_conta === "aluno"
                    ).length;


                const totalAdmins =
                    data.filter(
                        usuario =>
                            usuario.tipo_conta === "admin" ||
                            usuario.tipo_conta === "admin_principal"
                    ).length;


                document.getElementById(
                    "total-usuarios"
                ).textContent =
                    totalUsuarios;


                document.getElementById(
                    "total-alunos"
                ).textContent =
                    totalAlunos;


                document.getElementById(
                    "total-admins"
                ).textContent =
                    totalAdmins;


                // ---------------------------------------------
                // TABELA
                // ---------------------------------------------

                const tbody =
                    document.getElementById(
                        "usuarios-body"
                    );


                tbody.innerHTML = "";


                data.forEach(usuario => {

                    const tr =
                        document.createElement("tr");


                    // -----------------------------------------
                    // PROGRESSO
                    // -----------------------------------------

                    const aulasConcluidas =
                        progresso
                            ? progresso.filter(
                                item =>
                                    item.user_id === usuario.id
                            ).length
                            : 0;


                    const totalAulas = 4;


                    const percentual =
                        Math.round(
                            (aulasConcluidas / totalAulas) * 100
                        );


                    // -----------------------------------------
                    // DATA DE CADASTRO
                    // -----------------------------------------

                    const dataCadastro =
                        usuario.data_cadastro
                            ? new Date(
                                usuario.data_cadastro
                            ).toLocaleDateString(
                                "pt-BR"
                            )
                            : "-";


                    // -----------------------------------------
                    // ÚLTIMO ACESSO
                    // -----------------------------------------

                    const ultimoAcesso =
                        usuario.ultimo_acesso
                            ? new Date(
                                usuario.ultimo_acesso
                            ).toLocaleString(
                                "pt-BR",
                                {
                                    timeZone:
                                        "America/Sao_Paulo",

                                    day: "2-digit",
                                    month: "2-digit",
                                    year: "numeric",

                                    hour: "2-digit",
                                    minute: "2-digit"
                                }
                            )
                            : "Nunca";


                    // -----------------------------------------
                    // TIPO DE CONTA
                    // -----------------------------------------

                    let tipoTexto =
                        usuario.tipo_conta;


                    if (
                        usuario.tipo_conta ===
                        "admin_principal"
                    ) {

                        tipoTexto =
                            "Admin principal";

                    } else if (
                        usuario.tipo_conta ===
                        "admin"
                    ) {

                        tipoTexto =
                            "Administrador";

                    } else {

                        tipoTexto =
                            "Aluno";

                    }


                    // -----------------------------------------
                    // LINHA
                    // -----------------------------------------

                    tr.innerHTML = `

                        <td>
                            ${usuario.nome || "-"}
                        </td>

                        <td>
                            ${usuario.email || "-"}
                        </td>

                        <td>
                            ${usuario.whatsapp || "-"}
                        </td>

                        <td>

                            <span
                                class="badge
                                ${
                                    usuario.tipo_conta !==
                                    "aluno"
                                        ? "badge-admin"
                                        : ""
                                }"
                            >

                                ${tipoTexto}

                            </span>

                        </td>

                        <td>
                            ${dataCadastro}
                        </td>

                        <td>
                            ${ultimoAcesso}
                        </td>

                        <td>
                            ${aulasConcluidas}/${totalAulas}
                            aulas (${percentual}%)
                        </td>

                    `;


                    tbody.appendChild(tr);

                });


                // ---------------------------------------------
                // ESCONDER MENSAGEM
                // ---------------------------------------------

                mensagem.style.display =
                    "none";


            } catch (error) {

                console.error(error);

                mensagem.innerHTML =
                    `<span class="error">
                        Ocorreu um erro ao carregar o painel.
                    </span>`;

            }

        }


        // ---------------------------------------------
        // INICIAR
        // ---------------------------------------------

        carregarPainel();

    </script>

</body>

</html>
