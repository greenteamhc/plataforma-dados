<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* NAVBAR */

        .navbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .navbar a {
            color: #222;
            text-decoration: none;
            font-size: 14px;
        }

        /* CONTAINER */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .page-header p {
            margin: 0;
            color: #666;
        }

        /* CARDS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .stat-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        /* ALUNOS */

        .section {
            background: white;
            border-radius: 10px;
            padding: 25px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .section h2 {
            margin-top: 0;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            font-size: 13px;
            color: #666;
        }

        td {
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            background: #eee;
        }

        .badge-admin {
            background: #222;
            color: white;
        }

        .message {
            padding: 20px;
            text-align: center;
            color: #666;
        }

        .error {
            color: #b00020;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <header class="navbar">

        <div class="logo">
            Plataforma de Estudos
        </div>

        <a href="index.html">
            Voltar para a plataforma
        </a>

    </header>


    <main class="container">

        <div class="page-header">

            <h1>Painel Administrativo</h1>

            <p>
                Acompanhe os usuários da plataforma.
            </p>

        </div>


        <!-- MÉTRICAS -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    Total de usuários
                </div>

                <div
                    class="stat-number"
                    id="total-usuarios"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Alunos
                </div>

                <div
                    class="stat-number"
                    id="total-alunos"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Administradores
                </div>

                <div
                    class="stat-number"
                    id="total-admins"
                >
                    -
                </div>

            </div>

        </section>


        <!-- LISTA DE USUÁRIOS -->

        <section class="section">

            <h2>Usuários cadastrados</h2>

            <div
                id="mensagem"
                class="message"
            >
                Carregando usuários...
            </div>


            <div class="table-container">

                <table id="tabela-usuarios">

                    <thead>

                        <tr>

                            <th>Nome</th>

                            <th>E-mail</th>

                            <th>WhatsApp</th>

                            <th>Tipo</th>

                            <th>Cadastro</th>

                            <th>Último acesso</th>

                        </tr>

                    </thead>

                    <tbody id="usuarios-body"></tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        async function carregarPainel() {

            const mensagem =
                document.getElementById("mensagem");

            try {

                /*
                 * Verifica se existe uma sessão
                 */

                const {
                    data: {
                        session
                    }
                } = await supabaseClient.auth.getSession();


                if (!session) {

                    mensagem.textContent =
                        "Você precisa estar logado para acessar o painel.";

                    return;
                }


                /*
                 * Busca os perfis
                 */

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("profiles")
                    .select("*")
                    .order("data_cadastro", {
                        ascending: false
                    });


                if (error) {

                    console.error(error);

                    mensagem.innerHTML =
                        `<span class="error">
                            Erro ao carregar usuários:
                            ${error.message}
                        </span>`;

                    return;
                }


                /*
                 * MÉTRICAS
                 */

                const totalUsuarios =
                    data.length;

                const totalAlunos =
                    data.filter(
                        usuario =>
                            usuario.tipo_conta === "aluno"
                    ).length;

                const totalAdmins =
                    data.filter(
                        usuario =>
                            usuario.tipo_conta === "admin" ||
                            usuario.tipo_conta === "admin_principal"
                    ).length;


                document.getElementById(
                    "total-usuarios"
                ).textContent = totalUsuarios;


                document.getElementById(
                    "total-alunos"
                ).textContent = totalAlunos;


                document.getElementById(
                    "total-admins"
                ).textContent = totalAdmins;


                /*
                 * TABELA
                 */

                const tbody =
                    document.getElementById(
                        "usuarios-body"
                    );


                tbody.innerHTML = "";


                data.forEach(usuario => {

                    const tr =
                        document.createElement("tr");


                    const dataCadastro =
                        usuario.data_cadastro
                            ? new Date(
                                usuario.data_cadastro
                            ).toLocaleDateString("pt-BR")
                            : "-";


                    const ultimoAcesso =
                        usuario.ultimo_acesso
                            ? new Date(
                                usuario.ultimo_acesso
                            ).toLocaleDateString("pt-BR")
                            : "Nunca";


                    let tipoTexto =
                        usuario.tipo_conta;


                    tr.innerHTML = `

                        <td>
                            ${usuario.nome || "-"}
                        </td>

                        <td>
                            ${usuario.email || "-"}
                        </td>

                        <td>
                            ${usuario.whatsapp || "-"}
                        </td>

                        <td>

                            <span class="badge
                                ${
                                    usuario.tipo_conta !== "aluno"
                                    ? "badge-admin"
                                    : ""
                                }">

                                ${tipoTexto}

                            </span>

                        </td>

                        <td>
                            ${dataCadastro}
                        </td>

                        <td>
                            ${ultimoAcesso}
                        </td>

                    `;


                    tbody.appendChild(tr);

                });


                mensagem.style.display =
                    "none";


            } catch (error) {

                console.error(error);

                mensagem.innerHTML =
                    `<span class="error">
                        Ocorreu um erro ao carregar o painel.
                    </span>`;

            }

        }


        carregarPainel();

    </script>

</body>

</html>
