<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/x-icon" href="favicon-plataforma.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo | Plataforma de Estudos</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        /* =========================
           PALETA
        ========================= */

        :root {
            --navy: #07111F;
            --navy-light: #0B1727;
            --navy-card: #0A1625;

            --blue: #007BFF;
            --blue-hover: #0069D9;
            --blue-light: #B9DBFF;

            --green: #00A86B;
            --green-dark: #008F5A;

            --background: #020A14;

            --text: #F8FAFC;
            --text-secondary: #94A3B8;

            --border: #1E334B;
            --border-light: #28415D;

            --white: #FFFFFF;
        }

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           QUADRADINHOS DECORATIVOS
        ========================= */

        .decoracao {
            position: fixed;
            z-index: 0;
            display: grid;
            grid-template-columns: repeat(8, 14px);
            gap: 8px;
            pointer-events: none;
        }

        .decoracao span {
            width: 14px;
            height: 14px;
            background: var(--blue);
            opacity: 0.75;
        }

        .decoracao span:nth-child(3n) {
            background: var(--green);
        }

        .decoracao span:nth-child(4n) {
            opacity: 0.35;
        }

        .decoracao-top {
            top: 65px;
            left: 0;
        }

        .decoracao-bottom {
            right: 0;
            bottom: 20px;
            transform: rotate(180deg);
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 58px;
            background: var(--navy);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--white);
        }

        .logo span {
            color: var(--blue);
        }

        .nav-link {
            font-size: 13px;
            color: #CBD5E1;
            transition: 0.2s;
        }

        .nav-link:hover {
            color: var(--blue);
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: min(1000px, 92%);
            margin: 0 auto;
            padding: 42px 0 80px;
            position: relative;
            z-index: 2;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: var(--white);
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* =========================
           CARDS DE ESTATÍSTICAS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--navy-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            transition: 0.2s;
        }

        .stat-card:hover {
            border-color: var(--blue);
            transform: translateY(-2px);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 700;
            color: var(--blue);
        }

        /* =========================
           TABELA
        ========================= */

        .table-card {
            background: var(--navy-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            overflow: hidden;
        }

        .table-card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--white);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        thead {
            background: #0D1D30;
        }

        th {
            text-align: left;
            padding: 13px 10px;
            font-size: 11px;
            color: #94A3B8;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 10px;
            font-size: 12px;
            color: #CBD5E1;
            border-bottom: 1px solid #172A40;
        }

        tbody tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #0D1D30;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           BADGES
        ========================= */

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-admin {
            background: rgba(0, 123, 255, 0.15);
            border: 1px solid rgba(0, 123, 255, 0.35);
            color: #4DA3FF;
        }

        .badge-principal {
            background: rgba(0, 168, 107, 0.15);
            border: 1px solid rgba(0, 168, 107, 0.35);
            color: #20C98A;
        }

        .badge-aluno {
            background: #17263A;
            border: 1px solid #2A405A;
            color: #CBD5E1;
        }

        /* =========================
           PROGRESSO
        ========================= */

        .progress-text {
            color: var(--blue);
            font-weight: 600;
            white-space: nowrap;
        }

        /* =========================
           MENSAGEM DE ERRO
        ========================= */

        .message {
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #7F1D1D;
            background: rgba(127, 29, 29, 0.15);
            color: #FCA5A5;
            margin-top: 20px;
            display: none;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: var(--navy);
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 22px;
            color: #64748B;
            font-size: 11px;
            position: relative;
            z-index: 2;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                padding: 0 5%;
            }

            .container {
                width: 90%;
                padding-top: 30px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .decoracao {
                transform: scale(0.7);
            }
        }

        @media (max-width: 500px) {

            .navbar {
                height: 54px;
            }

            .logo {
                font-size: 16px;
            }

            .nav-link {
                font-size: 11px;
            }

            .container {
                width: 92%;
            }

            .table-card {
                padding: 15px;
            }

            .stat-card {
                padding: 18px;
            }
        }
    </style>
</head>

    <!-- =========================

    ========================== -->

    <nav class="navbar">

        <a href="area-aluno.html" class="logo">
            Plataforma de Estudos
        </a>

        <a href="area-aluno.html" class="nav-link">
            Voltar para a plataforma
        </a>

    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="container">

        <header class="page-header">
            <h1>Painel Administrativo</h1>
            <p>Acompanhe os usuários e o progresso da plataforma.</p>
        </header>


        <!-- ESTATÍSTICAS -->

        <section class="stats">

            <div class="stat-card">
                <div class="stat-label">
                    Total de usuários
                </div>

                <div class="stat-number" id="totalUsuarios">
                    0
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-label">
                    Alunos
                </div>

                <div class="stat-number" id="totalAlunos">
                    0
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-label">
                    Administradores
                </div>

                <div class="stat-number" id="totalAdmins">
                    0
                </div>
            </div>

        </section>


        <!-- TABELA -->

        <section class="table-card">

            <h2>Usuários cadastrados</h2>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>WhatsApp</th>
                            <th>Tipo</th>
                            <th>Cadastro</th>
                            <th>Último acesso</th>
                            <th>Progresso</th>
                        </tr>
                    </thead>

                    <tbody id="usuariosTabela">
                    </tbody>

                </table>

            </div>

            <div id="mensagemErro" class="message"></div>

        </section>

    </main>


    <!-- =========================

    ========================== -->

    <footer>
        Plataforma de Estudos — GTHC
    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        async function carregarPainel() {

            try {

                /* =========================
                   VERIFICAR USUÁRIO LOGADO
                ========================== */

                const {
                    data: { user },
                    error: authError
                } = await supabaseClient.auth.getUser();

                if (authError || !user) {
                    window.location.href = "login.html";
                    return;
                }


                /* =========================
                   VERIFICAR SE É ADMIN
                ========================== */

                const {
                    data: perfil,
                    error: perfilError
                } = await supabaseClient
                    .from("profiles")
                    .select("tipo_conta")
                    .eq("id", user.id)
                    .single();

                if (
                    perfilError ||
                    !perfil ||
                    !["admin", "admin_principal"].includes(perfil.tipo_conta)
                ) {
                    alert("Você não possui permissão para acessar o painel administrativo.");
                    window.location.href = "area-aluno.html";
                    return;
                }


                /* =========================
                   BUSCAR USUÁRIOS
                ========================== */

                const {
                    data: usuarios,
                    error: usuariosError
                } = await supabaseClient
                    .from("profiles")
                    .select("*")
                    .order("data_cadastro", {
                        ascending: true
                    });

                if (usuariosError) {
                    throw usuariosError;
                }


                /* =========================
                   BUSCAR PROGRESSO
                ========================== */

                const {
                    data: progresso,
                    error: progressoError
                } = await supabaseClient
                    .from("progress")
                    .select("*");

                if (progressoError) {
                    throw progressoError;
                }


                /* =========================
                   ESTATÍSTICAS
                ========================== */

                const totalUsuarios = usuarios.length;

                const totalAlunos = usuarios.filter(
                    usuario => usuario.tipo_conta === "aluno"
                ).length;

                const totalAdmins = usuarios.filter(
                    usuario =>
                        usuario.tipo_conta === "admin" ||
                        usuario.tipo_conta === "admin_principal"
                ).length;


                document.getElementById("totalUsuarios").textContent =
                    totalUsuarios;

                document.getElementById("totalAlunos").textContent =
                    totalAlunos;

                document.getElementById("totalAdmins").textContent =
                    totalAdmins;


                /* =========================
                   TABELA
                ========================== */

                const tabela =
                    document.getElementById("usuariosTabela");

                tabela.innerHTML = "";


                usuarios.forEach(usuario => {

                    const progressoUsuario =
                        progresso.filter(
                            item => item.user_id === usuario.id
                        );

                    const aulasConcluidas =
                        progressoUsuario.filter(
                            item => item.completed === true
                        ).length;

                    const totalAulas = 4;

                    const percentual =
                        Math.round(
                            (aulasConcluidas / totalAulas) * 100
                        );


                    /* =========================
                       TIPO DE CONTA
                    ========================== */

                    let tipoTexto = "Aluno";
                    let classeTipo = "badge-aluno";

                    if (usuario.tipo_conta === "admin") {
                        tipoTexto = "Administrador";
                        classeTipo = "badge-admin";
                    }

                    if (usuario.tipo_conta === "admin_principal") {
                        tipoTexto = "Admin principal";
                        classeTipo = "badge-principal";
                    }


                    /* =========================
                       DATA DE CADASTRO
                    ========================== */

                    const dataCadastro =
                        usuario.data_cadastro
                            ? new Date(
                                usuario.data_cadastro
                            ).toLocaleDateString("pt-BR", {
                                timeZone: "America/Sao_Paulo"
                            })
                            : "—";


                    /* =========================
                       ÚLTIMO ACESSO
                    ========================== */

                    const ultimoAcesso =
                        usuario.ultimo_acesso
                            ? new Date(
                                usuario.ultimo_acesso
                            ).toLocaleString("pt-BR", {
                                timeZone: "America/Sao_Paulo",
                                day: "2-digit",
                                month: "2-digit",
                                year: "numeric",
                                hour: "2-digit",
                                minute: "2-digit"
                            })
                            : "Nunca";


                    /* =========================
                       LINHA
                    ========================== */

                    const linha =
                        document.createElement("tr");

                    linha.innerHTML = `

                        <td>
                            ${usuario.nome || "—"}
                        </td>

                        <td>
                            ${usuario.email || "—"}
                        </td>

                        <td>
                            ${usuario.whatsapp || "—"}
                        </td>

                        <td>
                            <span class="badge ${classeTipo}">
                                ${tipoTexto}
                            </span>
                        </td>

                        <td>
                            ${dataCadastro}
                        </td>

                        <td>
                            ${ultimoAcesso}
                        </td>

                        <td>
                            <span class="progress-text">
                                ${aulasConcluidas}/${totalAulas}
                                aulas (${percentual}%)
                            </span>
                        </td>

                    `;

                    tabela.appendChild(linha);

                });


            } catch (error) {

                console.error(
                    "Erro ao carregar painel:",
                    error
                );

                const mensagem =
                    document.getElementById("mensagemErro");

                mensagem.style.display = "block";

                mensagem.textContent =
                    "Não foi possível carregar os dados do painel.";

            }

        }


        /* =========================
           INICIAR
        ========================== */

        carregarPainel();

    </script>
