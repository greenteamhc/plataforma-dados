<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Plataforma de Estudos</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F5F8FC;
            color: #07111F;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 72px;
            background: #07111F;
            display: flex;
            align-items: center;
            padding: 0 6%;
        }

        .container {
            width: 100%;
        }

        .navbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .logo:hover {
            color: #00A86B;
        }

        .navbar nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .navbar nav a {
            color: #CBD5E1;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.2s;
        }

        .navbar nav a:hover {
            color: #FFFFFF;
        }


        /* =========================
           ÁREA DE LOGIN
        ========================= */

        .auth-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: #FFFFFF;
            border: 1px solid #DCE4EE;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(7, 17, 31, 0.06);
        }


        /* =========================
           TÍTULO
        ========================= */

        .auth-card h1 {
            margin: 0 0 10px;
            color: #07111F;
            font-size: 30px;
        }

        .auth-subtitle {
            margin: 0 0 30px;
            color: #64748B;
            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================
           FORMULÁRIO
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #07111F;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            background: #FFFFFF;
            color: #07111F;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input::placeholder {
            color: #94A3B8;
        }

        .form-group input:focus {
            border-color: #007BFF;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.10);
        }


        /* =========================
           BOTÃO
        ========================= */

        .btn-primary {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: #007BFF;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: #0069D9;
        }

        .btn-primary:disabled {
            background: #E2E8F0;
            color: #94A3B8;
            cursor: not-allowed;
        }


        /* =========================
           MENSAGEM
        ========================= */

        .form-message {
            min-height: 22px;
            margin: 18px 0 0;
            font-size: 14px;
            line-height: 1.5;
        }


        /* =========================
           RODAPÉ DO CARD
        ========================= */

        .auth-footer {
            margin: 28px 0 0;
            padding-top: 22px;
            border-top: 1px solid #E2E8F0;
            color: #64748B;
            font-size: 14px;
            text-align: center;
        }

        .auth-footer a {
            color: #007BFF;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            color: #0069D9;
            text-decoration: underline;
        }


        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                height: auto;
                min-height: 68px;
                padding: 15px 18px;
            }

            .logo {
                font-size: 17px;
            }

            .navbar nav {
                gap: 12px;
            }

            .navbar nav a {
                font-size: 13px;
            }

            .auth-page {
                min-height: calc(100vh - 68px);
                padding: 30px 16px;
            }

            .auth-card {
                padding: 28px 22px;
                border-radius: 14px;
            }

            .auth-card h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header class="navbar">

        <div class="container navbar-content">

            <a
                href="index.html"
                class="logo"
            >
                Plataforma de Estudos
            </a>

            <nav>

                <a href="index.html">
                    Início
                </a>

                <a href="cadastro.html">
                    Criar conta
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================
         ÁREA DE LOGIN
    ========================= -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Entrar
            </h1>

            <p class="auth-subtitle">
                Entre com seu e-mail para acessar seus estudos.
            </p>


            <!-- FORMULÁRIO -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu.email@universidade.edu.br"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                    id="btnLogin"
                >
                    Enviar link de acesso
                </button>

            </form>


            <!-- MENSAGEM -->

            <p
                id="mensagem"
                class="form-message"
            ></p>


            <!-- CADASTRO -->

            <p class="auth-footer">

                Ainda não possui uma conta?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </div>

    </main>



    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>



    <!-- =========================
         LOGIN
    ========================= -->

    <script>

        const form = document.getElementById("loginForm");
        const mensagem = document.getElementById("mensagem");
        const btnLogin = document.getElementById("btnLogin");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email = document
                .getElementById("email")
                .value
                .trim();


            if (!email) {
                return;
            }


            /* Estado de carregamento */

            btnLogin.disabled = true;

            btnLogin.textContent =
                "Enviando...";

            mensagem.textContent =
                "Enviando link de acesso...";

            mensagem.style.color =
                "#64748B";


            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithOtp({

                        email: email,

                        options: {
                            shouldCreateUser: false,
                            emailRedirectTo:
                                "https://greenteamhc.github.io/plataforma-dados/area-aluno.html"
                        }

                    });


                if (error) {

                    throw error;

                }


                /* Sucesso */

                mensagem.textContent =
                    "Link de acesso enviado! Verifique seu e-mail.";

                mensagem.style.color =
                    "#00A86B";


                btnLogin.textContent =
                    "Link enviado";


            } catch (error) {

                console.error(
                    "Erro no login:",
                    error
                );


                mensagem.textContent =
                    "Não foi possível entrar: " +
                    error.message;

                mensagem.style.color =
                    "#B00020";


                btnLogin.disabled = false;

                btnLogin.textContent =
                    "Enviar link de acesso";

            }

        });

    </script>


</body>

</html>
