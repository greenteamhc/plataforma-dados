```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta - Plataforma de Estudos</title>

    <link rel="stylesheet" href="style.css">


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #F5F8FC;

            color: #07111F;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            background: #07111F;

            border-bottom:
                1px solid #15263A;

            padding: 18px 30px;

            box-shadow:
                0 2px 10px
                rgba(7, 17, 31, 0.08);
        }

        .container {
            max-width: 1100px;

            margin: auto;
        }

        .navbar-content {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }

        .logo {
            color: #FFFFFF;

            text-decoration: none;

            font-size: 22px;

            font-weight: bold;

            transition: 0.2s;
        }

        .logo:hover {
            color: #00A86B;
        }

        .navbar nav {
            display: flex;

            align-items: center;

            gap: 22px;
        }

        .navbar nav a {
            color: #CBD5E1;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .navbar nav a:hover {
            color: #FFFFFF;
        }


        /* =====================================================
           PÁGINA DE AUTENTICAÇÃO
        ===================================================== */

        .auth-page {
            min-height:
                calc(100vh - 75px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .auth-card {
            width: 100%;

            max-width: 470px;

            background: #FFFFFF;

            border:
                1px solid #DCE4EE;

            border-radius: 16px;

            padding: 38px;

            box-shadow:
                0 8px 30px
                rgba(7, 17, 31, 0.08);
        }

        .auth-card h1 {
            margin:
                0 0 8px 0;

            color: #07111F;

            font-size: 30px;
        }

        .auth-subtitle {
            margin:
                0 0 30px 0;

            color: #64748B;

            line-height: 1.5;

            font-size: 15px;
        }


        /* =====================================================
           FORMULÁRIO
        ===================================================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #07111F;

            font-size: 14px;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #CBD5E1;

            border-radius: 8px;

            background: #FFFFFF;

            color: #07111F;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: #94A3B8;
        }

        .form-group input:focus {
            border-color: #007BFF;

            box-shadow:
                0 0 0 3px
                rgba(0, 123, 255, 0.10);
        }


        /* =====================================================
           BOTÃO
        ===================================================== */

        .btn-primary {
            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 14px 18px;

            background: #007BFF;

            color: #FFFFFF;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .btn-primary:hover {
            background: #0069D9;

            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #94A3B8;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .form-message {
            min-height: 20px;

            margin:
                18px 0 0 0;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =====================================================
           RODAPÉ DO CARD
        ===================================================== */

        .auth-footer {
            margin:
                25px 0 0 0;

            padding-top: 20px;

            border-top:
                1px solid #DCE4EE;

            text-align: center;

            color: #64748B;

            font-size: 14px;
        }

        .auth-footer a {
            color: #007BFF;

            font-weight: bold;

            text-decoration: none;

            transition: 0.2s;
        }

        .auth-footer a:hover {
            color: #0069D9;

            text-decoration: underline;
        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 600px) {

            .navbar {
                padding: 16px 20px;
            }

            .navbar-content {
                flex-direction: column;

                align-items: flex-start;
            }

            .navbar nav {
                width: 100%;

                justify-content: space-between;
            }

            .auth-page {
                align-items: flex-start;

                padding-top: 30px;
            }

            .auth-card {
                padding: 28px 22px;
            }

            .auth-card h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <header class="navbar">

        <div class="container navbar-content">

            <a
                href="index.html"
                class="logo"
            >
                Plataforma de Estudos
            </a>

            <nav>

                <a href="index.html">
                    Início
                </a>

                <a href="login.html">
                    Entrar
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         CADASTRO
    ===================================================== -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Criar conta
            </h1>

            <p class="auth-subtitle">
                Crie sua conta para acompanhar seus estudos.
            </p>


            <form id="cadastroForm">


                <!-- NOME -->

                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome completo"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        E-mail institucional
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu.email@universidade.edu.br"
                        required
                    >

                </div>


                <!-- WHATSAPP -->

                <div class="form-group">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        placeholder="(11) 99999-9999"
                        required
                    >

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-primary"
                    id="btnCadastro"
                >
                    Criar minha conta
                </button>

            </form>


            <!-- MENSAGEM -->

            <p
                id="mensagem"
                class="form-message"
            ></p>


            <!-- LOGIN -->

            <p class="auth-footer">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </div>

    </main>


    <!-- =====================================================
         SUPABASE
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const form =
            document.getElementById(
                "cadastroForm"
            );

        const mensagem =
            document.getElementById(
                "mensagem"
            );

        const btnCadastro =
            document.getElementById(
                "btnCadastro"
            );


        // =====================================================
        // CADASTRO
        // =====================================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const whatsapp =
                    document
                        .getElementById("whatsapp")
                        .value
                        .trim();


                // ---------------------------------------------
                // VALIDAR CAMPOS
                // ---------------------------------------------

                if (
                    !nome ||
                    !email ||
                    !whatsapp
                ) {

                    mensagem.textContent =
                        "Preencha todos os campos.";

                    mensagem.style.color =
                        "#B00020";

                    return;
                }


                // ---------------------------------------------
                // DESABILITAR BOTÃO
                // ---------------------------------------------

                btnCadastro.disabled =
                    true;

                btnCadastro.textContent =
                    "Criando conta...";


                mensagem.textContent =
                    "Enviando link de confirmação...";

                mensagem.style.color =
                    "#64748B";


                try {


                    // -----------------------------------------
                    // CRIAR USUÁRIO
                    // -----------------------------------------

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithOtp({

                                email: email,

                                options: {

                                    shouldCreateUser:
                                        true,

                                    data: {

                                        nome:
                                            nome,

                                        whatsapp:
                                            whatsapp

                                    }

                                }

                            });


                    if (error) {

                        throw error;

                    }


                    // -----------------------------------------
                    // SUCESSO
                    // -----------------------------------------

                    mensagem.textContent =
                        "Conta criada! Enviamos um link para seu e-mail. Clique nele para acessar a plataforma.";

                    mensagem.style.color =
                        "#00A86B";


                    form.reset();


                } catch (error) {

                    console.error(
                        "Erro no cadastro:",
                        error
                    );


                    mensagem.textContent =
                        "Não foi possível criar a conta: "
                        + error.message;

                    mensagem.style.color =
                        "#B00020";


                } finally {

                    btnCadastro.disabled =
                        false;

                    btnCadastro.textContent =
                        "Criar minha conta";

                }

            }
        );

    </script>

</body>

</html>
```
