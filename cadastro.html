<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Plataforma de Estudos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Plataforma de Estudos
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Entrar</a>
        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Criar conta</h1>

            <p class="auth-description">
                Crie sua conta para começar seus estudos.
            </p>


            <form id="cadastroForm">

                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail institucional
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu.email@universidade.edu.br"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        placeholder="(11) 99999-9999"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                    id="btnCadastro"
                >
                    Criar minha conta
                </button>


                <p id="mensagem" class="form-message"></p>

            </form>


            <p class="auth-footer">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Nossa conexão -->
    <script src="supabase.js"></script>


    <script>

        const formulario = document.getElementById("cadastroForm");

        const mensagem = document.getElementById("mensagem");

        const botao = document.getElementById("btnCadastro");


        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();


            const nome = document
                .getElementById("nome")
                .value
                .trim();

            const email = document
                .getElementById("email")
                .value
                .trim();

            const whatsapp = document
                .getElementById("whatsapp")
                .value
                .trim();


            if (!nome || !email || !whatsapp) {

                mensagem.textContent =
                    "Preencha todos os campos.";

                mensagem.className =
                    "form-message error";

                return;
            }


            botao.disabled = true;

            botao.textContent = "Criando conta...";

            mensagem.textContent = "";


            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithOtp({

                        email: email,

                        options: {

                            data: {
                                name: nome,
                                whatsapp: whatsapp
                            },

                            emailRedirectTo:
                                window.location.origin +
                                "/login.html"

                        }

                    });


                if (error) {
                    throw error;
                }


                mensagem.textContent =
                    "Cadastro iniciado! Verifique seu e-mail para confirmar o acesso.";

                mensagem.className =
                    "form-message success";


                formulario.reset();


            } catch (error) {

                console.error(error);

                mensagem.textContent =
                    "Não foi possível criar a conta: " +
                    error.message;

                mensagem.className =
                    "form-message error";


            } finally {

                botao.disabled = false;

                botao.textContent =
                    "Criar minha conta";

            }

        });

    </script>

</body>

</html>
