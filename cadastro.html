<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Green Team</title>

    <link rel="icon" type="image/x-icon" href="favicon-plataforma.ico">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 80%,
                    rgba(0, 168, 107, 0.08),
                    transparent 30%
                ),
                #050B12;

            color: #FFFFFF;

            overflow-x: hidden;
        }


        /* =====================================
           QUADRADOS DECORATIVOS
        ===================================== */

        .pixel {
            position: fixed;

            width: 18px;
            height: 18px;

            background: #087CFF;

            opacity: 0.65;

            z-index: 0;
        }

        .pixel.soft {
            opacity: 0.25;
        }

        .pixel.green {
            background: #00A86B;
            opacity: 0.35;
        }


        /* canto superior esquerdo */

        .p1 {
            top: 90px;
            left: 0;
        }

        .p2 {
            top: 108px;
            left: 18px;
        }

        .p3 {
            top: 126px;
            left: 36px;
        }

        .p4 {
            top: 144px;
            left: 18px;
        }

        .p5 {
            top: 90px;
            left: 54px;
        }

        .p6 {
            top: 162px;
            left: 0;
        }


        /* canto inferior direito */

        .p7 {
            right: 0;
            bottom: 75px;
        }

        .p8 {
            right: 18px;
            bottom: 93px;
        }

        .p9 {
            right: 36px;
            bottom: 111px;
        }

        .p10 {
            right: 18px;
            bottom: 129px;
        }

        .p11 {
            right: 54px;
            bottom: 75px;
        }

        .p12 {
            right: 0;
            bottom: 147px;
        }


        /* =====================================
           NAVBAR
        ===================================== */

        nav {
            height: 58px;

            background: #07111F;

            border-bottom: 1px solid #1E293B;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            position: relative;

            z-index: 5;
        }

        .logo {
            text-decoration: none;

            color: #FFFFFF;

            font-size: 18px;

            font-weight: 800;
        }

        .logo span {
            color: #087CFF;
        }

        .nav-links {
            display: flex;

            align-items: center;

            gap: 24px;
        }

        .nav-links a {
            color: #CBD5E1;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #FFFFFF;
        }


        /* =====================================
           ÁREA PRINCIPAL
        ===================================== */

        .page {
            min-height: calc(100vh - 58px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;

            position: relative;

            z-index: 1;
        }


        /* =====================================
           CARD
        ===================================== */

        .auth-card {
            width: 100%;

            max-width: 390px;

            background: #0B1522;

            border: 1px solid #1E293B;

            border-radius: 12px;

            padding: 36px 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }


        .auth-card::before {
            content: "";

            display: block;

            width: 45px;

            height: 3px;

            background: #087CFF;

            margin-bottom: 25px;
        }


        .auth-card h1 {
            font-size: 27px;

            margin-bottom: 8px;

            color: #FFFFFF;
        }

        .subtitle {
            color: #94A3B8;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 27px;
        }


        /* =====================================
           FORMULÁRIO
        ===================================== */

        label {
            display: block;

            color: #CBD5E1;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        .field {
            margin-bottom: 18px;
        }

        input {
            width: 100%;

            height: 43px;

            padding: 0 13px;

            border-radius: 7px;

            border: 1px solid #334155;

            background: #07111F;

            color: #FFFFFF;

            outline: none;

            font-size: 13px;

            transition: 0.2s;
        }

        input::placeholder {
            color: #64748B;
        }

        input:focus {
            border-color: #087CFF;

            box-shadow:
                0 0 0 2px rgba(8, 124, 255, 0.12);
        }


        /* =====================================
           BOTÃO
        ===================================== */

        button {
            width: 100%;

            height: 45px;

            border: none;

            border-radius: 7px;

            background: #087CFF;

            color: #FFFFFF;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #0069D9;

            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================
           MENSAGENS
        ===================================== */

        #mensagem {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 7px;

            background: rgba(0, 168, 107, 0.10);

            border: 1px solid rgba(0, 168, 107, 0.35);

            color: #00C98B;

            font-size: 12px;

            line-height: 1.5;
        }


        #erro {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 7px;

            background: rgba(239, 68, 68, 0.08);

            border: 1px solid rgba(239, 68, 68, 0.30);

            color: #FCA5A5;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =====================================
           RODAPÉ DO CARD
        ===================================== */

        .auth-footer {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #1E293B;

            text-align: center;

            color: #64748B;

            font-size: 12px;
        }

        .auth-footer a {
            color: #087CFF;

            text-decoration: none;

            font-weight: 700;
        }

        .auth-footer a:hover {
            color: #4DA3FF;
        }


        /* =====================================
           RESPONSIVO
        ===================================== */

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            .logo {
                font-size: 16px;
            }

            .page {
                padding: 35px 15px;
            }

            .auth-card {
                padding: 30px 24px;
            }

        }

    </style>

</head>


<body>


    <!-- QUADRADOS -->

    <div class="pixel p1"></div>
    <div class="pixel soft p2"></div>
    <div class="pixel p3"></div>
    <div class="pixel soft p4"></div>
    <div class="pixel p5"></div>
    <div class="pixel green p6"></div>

    <div class="pixel p7"></div>
    <div class="pixel soft p8"></div>
    <div class="pixel p9"></div>
    <div class="pixel soft p10"></div>
    <div class="pixel p11"></div>
    <div class="pixel green p12"></div>


    <!-- NAVBAR -->

    <nav>

        <a
            href="index.html"
            class="logo"
        >
            GREEN <span>TEAM</span>
        </a>


        <div class="nav-links">

            <a href="index.html">
                Início
            </a>

            <a href="login.html">
                Entrar
            </a>

        </div>

    </nav>


    <!-- CONTEÚDO -->

    <main class="page">

        <div class="auth-card">

            <h1>
                Criar conta
            </h1>

            <p class="subtitle">
                Crie sua conta para acompanhar seus estudos.
            </p>


            <form id="cadastroForm">


                <div class="field">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome completo"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        E-mail institucional
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu.email@universidade.edu.br"
                        required
                    >

                </div>


                <div class="field">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        placeholder="(11) 99999-9999"
                    >

                </div>


                <button
                    type="submit"
                    id="btnCadastro"
                >
                    Criar minha conta
                </button>


            </form>


            <div id="mensagem"></div>

            <div id="erro"></div>


            <div class="auth-footer">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const form = document.getElementById("cadastroForm");

        const btn = document.getElementById("btnCadastro");

        const mensagem = document.getElementById("mensagem");

        const erro = document.getElementById("erro");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            mensagem.style.display = "none";
            erro.style.display = "none";


            const nome =
                document.getElementById("nome").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const whatsapp =
                document.getElementById("whatsapp").value.trim();


            if (!nome || !email) {

                erro.textContent =
                    "Preencha os campos obrigatórios.";

                erro.style.display = "block";

                return;
            }


            btn.disabled = true;

            btn.textContent = "Criando conta...";


            const { data, error } =
                await supabaseClient.auth.signInWithOtp({
                    email: email,
                    options: {
                        shouldCreateUser: true,
                        emailRedirectTo: "https://greenteamhc.github.io/plataforma-dados/area-aluno.html",
                        data: {
                            nome: nome,
                            whatsapp: whatsapp
                        }
                    }
                });


            if (error) {

                erro.textContent =
                    "Não foi possível criar a conta: " +
                    error.message;

                erro.style.display = "block";

                btn.disabled = false;

                btn.textContent = "Criar minha conta";

                return;
            }


            mensagem.textContent =
                "Conta criada! Verifique seu e-mail institucional para acessar a plataforma.";

            mensagem.style.display = "block";


            btn.disabled = false;

            btn.textContent = "Criar minha conta";

        });

    </script>


</body>

</html>
